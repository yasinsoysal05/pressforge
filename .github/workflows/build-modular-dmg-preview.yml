name: Build modular PressForge Intel DMG UI preview (NOT standalone)

on:
  push:
    branches: [build/modular-preview-snapshot-20261101]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pressforge-modular-snapshot-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-intel-dmg:
    name: PressForge modular Intel DMG UI preview (NOT standalone)
    runs-on: macos-15-intel
    timeout-minutes: 80
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Print environment and validate checkout
        run: |
          uname -m
          sw_vers
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
          python3 scripts/check-version.py
          python3 scripts/verify-project.py
      - name: Enforce preview classification
        run: |
          # A real portable runtime is not present on main.
          # This artifact MUST be labelled preview and MUST NOT be published as standalone.
          test ! -e src-tauri/resources/runtime/php/bin/php
          test ! -e src-tauri/resources/runtime/mariadb/bin/mariadbd
          echo 'DMG is an unsigned development preview. It uses user-installed PHP/WP-CLI/MariaDB.'
          echo 'Do not describe it as a portable PressForge installation.'
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile native Intel .app and .dmg
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg
      - name: Verify real DMG and its mounted app
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          [[ "${#dmgs[@]}" -eq 1 ]] || { echo "Expected exactly one DMG, got ${#dmgs[@]}"; exit 1; }
          dmg="${dmgs[0]}"
          hdiutil verify "$dmg"
          mnt="$(mktemp -d /tmp/pressforge-dmg-preview-XXXXXX)"
          mounted=0
          cleanup() {
            if [[ "$mounted" -eq 1 ]]; then hdiutil detach "$mnt" -quiet || true; fi
            rmdir "$mnt" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" -quiet "$dmg"
          mounted=1
          test -d "$mnt/PressForge.app"
          test ! -e "$mnt/PressForge.app/Contents/Resources/runtime/php/bin/php"
          # Tauri removes the intermediate bundle/macos app after making a DMG.
          # Inspect the shipped application INSIDE the mounted disk image.
          python3 - "$mnt/PressForge.app" <<'PY'
          import plistlib, pathlib, re, subprocess, sys
          app=pathlib.Path(sys.argv[1])
          with (app/'Contents/Info.plist').open('rb') as fp: info=plistlib.load(fp)
          assert info.get('CFBundleIdentifier') == 'dev.pressforge.desktop', info
          executable=info['CFBundleExecutable']
          binary=app/'Contents/MacOS'/executable
          assert binary.is_file(), f'Missing bundled executable: {binary}'
          description=subprocess.check_output(['file','-b',str(binary)],text=True)
          assert 'Mach-O' in description and 'x86_64' in description, description
          output=subprocess.check_output(['otool','-l',str(binary)],text=True)
          minimum=re.findall(r'minos[ ]+([0-9]+(?:[.][0-9]+){1,2})',output)
          if not minimum:
              minimum=re.findall(r'version[ ]+([0-9]+(?:[.][0-9]+){1,2})',output)
          assert minimum, 'No Mach-O minimum deployment version found'
          versions=[tuple((list(map(int,x.split('.'))) + [0,0,0])[:3]) for x in minimum]
          assert max(versions) <= (13,0,0), f'Executable target newer than Ventura: {versions}'
          plist_min=info.get('LSMinimumSystemVersion','13.0')
          assert tuple((list(map(int,plist_min.split('.'))) + [0,0,0])[:3]) <= (13,0,0), plist_min
          print('[OK] Mounted app executable:',binary.name)
          print('[OK] Intel x86_64, Mach-O minOS:',versions)
          print('[NOT TESTED] Real Ventura launch or portable WordPress engine')
          PY
          shasum -a 256 "$dmg"
          echo '[OK] Physical Intel DMG opens and contains PressForge.app.'
          echo '[WARNING] No bundled PHP/MariaDB; not tested for WordPress site creation.'
      - name: Upload DMG preview for download
        uses: actions/upload-artifact@v4
        with:
          name: PressForge-MODULAR-Intel-macOS-UI-PREVIEW
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
