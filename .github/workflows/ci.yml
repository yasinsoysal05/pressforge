name: Source and native macOS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-checks:
    name: Source and frontend (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version consistency
        run: python3 scripts/check-version.py
      - name: Project structure checks
        run: python3 scripts/verify-project.py
      - name: PHP router syntax
        run: php -l src-tauri/src/router.php
      - name: Frontend TypeScript and Vite build
        run: |
          npm ci --no-audit --no-fund
          npm run build

  intel-native-build:
    name: Intel macOS native app compile (NOT Ventura runtime test)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Rust for Intel macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Show native toolchain
        run: |
          uname -a
          sw_vers
          xcode-select -p
          rustc -vV
          clang --version
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Require committed dependency lockfiles
        run: |
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
      - name: Compile Rust/Tauri and create non-distributable .app
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app
      - name: Inspect Intel architecture and minimum macOS version
        run: python3 scripts/check-native-macos-app.py
      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin --lib
