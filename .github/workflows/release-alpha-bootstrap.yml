name: Publish PressForge v0.2.0 alpha source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-alpha-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-prerelease:
    if: github.repository == 'yasinsoysal05/pressforge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and source tree
        run: |
          python3 scripts/check-version.py
          python3 scripts/verify-project.py
      - name: Create immutable annotated source tag if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse 'refs/tags/v0.2.0' >/dev/null 2>&1; then
            git tag -a v0.2.0 -m 'PressForge v0.2.0 - alpha source preview'
            git push origin 'refs/tags/v0.2.0'
          fi
      - name: Prepare versioned source ZIP
        run: |
          git archive --format=zip --prefix='pressforge/' -o PressForge-v0.2.0-source.zip v0.2.0
          unzip -t PressForge-v0.2.0-source.zip >/dev/null
      - name: Publish GitHub prerelease if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.0 release already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.2.0 PressForge-v0.2.0-source.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title 'PressForge v0.2.0 — Alpha Source Preview' \
            --notes-file docs/RELEASE-NOTES-v0.2.0.md \
            --prerelease
