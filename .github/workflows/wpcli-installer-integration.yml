name: WordPress installer integration checks (Ubuntu)

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/portable-runtime-validation]

permissions:
  contents: read

jobs:
  wpcli-install:
    name: Real WP-CLI core download/config/install and HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CI dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-server php-cli php-mysql php-curl php-mbstring php-xml php-zip
          sudo service mariadb start
          php -m | grep -i '^mysqli$'
      - name: Obtain digest-locked WP-CLI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request
          locked = json.loads(Path('runtime-lock.json').read_text())['wp_cli']
          assert locked['source'] == 'https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar'
          content = urllib.request.urlopen(locked['source'], timeout=90).read()
          assert hashlib.sha512(content).hexdigest() == locked['sha512']
          Path('/tmp/pressforge-wp-cli.phar').write_bytes(content)
          PY
          php /tmp/pressforge-wp-cli.phar --version
      - name: Install real WordPress with piped secrets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d /tmp/pressforge-wptest-XXXXXX)"
          server_pid=''
          cleanup() {
            if [[ -n "$server_pid" ]]; then kill "$server_pid" 2>/dev/null || true; fi
            sudo mariadb -e "DROP DATABASE IF EXISTS pf_ci_wordpress; DROP USER IF EXISTS 'pf_ci_user'@'localhost';" || true
            rm -rf -- "$tmp"
          }
          trap cleanup EXIT
          sudo mariadb -e "CREATE DATABASE pf_ci_wordpress CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'pf_ci_user'@'localhost' IDENTIFIED BY 'PressForge_ci_Only_2026'; GRANT ALL PRIVILEGES ON pf_ci_wordpress.* TO 'pf_ci_user'@'localhost';"
          php /tmp/pressforge-wp-cli.phar core download --path="$tmp" --locale=en_US
          printf '%s\n' 'PressForge_ci_Only_2026' | php /tmp/pressforge-wp-cli.phar config create \
            --path="$tmp" --dbname=pf_ci_wordpress --dbuser=pf_ci_user \
            --dbhost=localhost --prompt=dbpass --skip-check --quiet > "$tmp/private-config.log" 2>&1
          printf '%s\n' 'Local_test_admin_password_2026' | php /tmp/pressforge-wp-cli.phar core install \
            --path="$tmp" --url=http://127.0.0.1:18117 \
            '--title=PressForge Installation Smoke' --admin_user=pf_test \
            --admin_email=pf@example.invalid --skip-email --prompt=admin_password --quiet > "$tmp/private-install.log" 2>&1
          # PressForge serves the --path directory as the HTTP document root.
          php /tmp/pressforge-wp-cli.phar --path="$tmp" option update siteurl http://127.0.0.1:18117 --quiet
          php /tmp/pressforge-wp-cli.phar --path="$tmp" option update home http://127.0.0.1:18117 --quiet
          installed_home="$(php /tmp/pressforge-wp-cli.phar --path="$tmp" option get home)"
          test "$installed_home" = 'http://127.0.0.1:18117'
          installed_url="$(php /tmp/pressforge-wp-cli.phar --path="$tmp" option get siteurl)"
          installed_url="$(printf '%s' "$installed_url" | sed 's:/*$::')"
          echo "[CHECK] Installed site URL: $installed_url"
          test "$installed_url" = 'http://127.0.0.1:18117'
          php -S 127.0.0.1:18117 -t "$tmp" src-tauri/src/router.php >"$tmp/php.log" 2>&1 &
          server_pid="$!"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18117/ -o "$tmp/home.html" && \
              curl -fsS http://127.0.0.1:18117/wp-login.php -o "$tmp/login.html"; then
              echo "[OK] Real WP-CLI installation, WordPress homepage and login passed"
              exit 0
            fi
            sleep 1
          done
          echo "[FAIL] WordPress HTTP smoke failed"
          tail -n 30 "$tmp/php.log" || true
          exit 1
