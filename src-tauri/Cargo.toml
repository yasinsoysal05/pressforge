[package]
name = "pressforge"
version = "0.2.0"
description = "Independent local WordPress development studio for macOS"
authors = ["PressForge Contributors"]
edition = "2021"

[lib]
name = "pressforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
